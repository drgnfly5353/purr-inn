<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e4e8f6" />
    <meta name="description" content="Purr Inn: a quiet courtyard where every hotel guest's cat lives together." />
    <script>
      // Pick day or night before the first paint so the page never flashes.
      try {
        var t = localStorage.getItem("purr-inn:theme");
        var h = new Date().getHours();
        document.documentElement.dataset.theme = t || (h >= 19 || h < 6 ? "night" : "day");
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Purr Inn</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
